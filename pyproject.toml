[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "windows-software-updater"
version = "1.0.0"
description = "A PyQt6 desktop app that wraps winget to scan, apply, and manage Windows software updates."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Abdullah Al Baki" }]
keywords = ["winget", "updater", "windows", "pyqt6", "package-manager"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Software Distribution",
]
dependencies = [
    "PyQt6>=6.6",
    "requests==2.32.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.5",
    "mypy>=1.10",
]
build = [
    "pyinstaller>=6.6",
]

[project.scripts]
# Console-script entry points (useful for `pipx`/dev runs).
wsu-updater = "wsu.app.updater:main"
wsu-notifier = "wsu.app.notifier:main"

[project.urls]
Homepage = "https://github.com/abdullahal-baki/windows-software-updater"
Repository = "https://github.com/abdullahal-baki/windows-software-updater"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wsu = ["*.ico"]

# -- Tooling -----------------------------------------------------------------

[tool.ruff]
line-length = 88
target-version = "py39"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = [
    "N802",  # Qt overrides use camelCase method names
    "B008",  # Qt APIs commonly take callables/objects as defaults
]

[tool.ruff.lint.per-file-init]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.9"
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
